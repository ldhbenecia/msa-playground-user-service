server:
  port: 8081

health:
  message: "Hello from user-service in Helm K8S DEV!"

# JWT 서명 키. 값은 배포 쪽 Secret 이 TOKEN_SECRET 으로 넣음
# 기본값을 두지 않음 — 빠지면 아무 키로나 뜨는 대신 기동 단계에서 실패해야 함
# api-gateway 가 같은 키로 검증하므로 두 서비스가 같은 값을 받아야 함
token:
  secret: ${TOKEN_SECRET}
  expiration_time: ${TOKEN_EXPIRATION_TIME:86400000}

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: ${DB_URL}
    # H2 인메모리 기본 계정이라 비밀이 아님. 기본값을 둬서 환경변수가 없을 때
    # 플레이스홀더 문자열이 그대로 사용자명이 되는 일을 막음
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /user-h2-console

  cloud:
    function:
      definition: orderCreated
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS}
      bindings:
        orderCreated-in-0:
          destination: order-created
          group: user-service
        pointsFailed-out-0:
          destination: points-failed
          content-type: application/json

    kubernetes:
      config:
        enabled: false
      discovery:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}